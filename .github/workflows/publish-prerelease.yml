name: Publish Beta/Alpha to Modrinth

on:
  push:
    tags:
      - 'v*.*.*-beta*'
      - 'v*.*.*-alpha*'
      - '*.*.*-beta*'
      - '*.*.*-alpha*'
      - 'v*.*.*.*-beta*'
      - 'v*.*.*.*-alpha*'
      - '*.*.*.*-beta*'
      - '*.*.*.*-alpha*'

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Get version from pom.xml
      id: get_version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

    - name: Determine version type
      id: version_type
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        if [[ $VERSION == *"alpha"* ]]; then
          echo "TYPE=alpha" >> $GITHUB_OUTPUT
        elif [[ $VERSION == *"beta"* ]]; then
          echo "TYPE=beta" >> $GITHUB_OUTPUT
        else
          echo "TYPE=release" >> $GITHUB_OUTPUT
        fi

    - name: Upload to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: XqguI8fH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        files: target/MorePowerGems-*.jar

        name: MorePowerGems v${{ steps.get_version.outputs.VERSION }}
        version: ${{ steps.get_version.outputs.VERSION }}
        version-type: ${{ steps.version_type.outputs.TYPE }}

        loaders: |
          bukkit
          paper
          spigot
          purpur

        game-versions: |
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10

        dependencies: |
          powergems | depends | *
          seallib | depends | *

        changelog-file: CHANGELOG.md*

        java: 21

    - name: Create GitHub Pre-Release
      uses: softprops/action-gh-release@v2
      with:
        name: MorePowerGems v${{ steps.get_version.outputs.VERSION }} (${{ steps.version_type.outputs.TYPE }})
        files: target/MorePowerGems-*.jar
        draft: false
        prerelease: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
