name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download PowerGems and SealLib dependencies
      run: |
        mkdir -p ~/.m2/repository/dev/iseal/PowerGems/3.6.1.1
        mkdir -p ~/.m2/repository/dev/iseal/SealLib/1.2.0.1
        curl -L -o ~/.m2/repository/dev/iseal/PowerGems/3.6.1.1/PowerGems-3.6.1.1.jar \
          "https://cdn.modrinth.com/data/kCgEfc6s/versions/BW1Dg8Y9/PowerGems-3.6.1.1.jar"
        curl -L -o ~/.m2/repository/dev/iseal/SealLib/1.2.0.1/SealLib-1.2.0.1.jar \
          "https://cdn.modrinth.com/data/8ghxB9YU/versions/0QSvCPq8/SealLib-1.2.0.1.jar"
        cat > ~/.m2/repository/dev/iseal/PowerGems/3.6.1.1/PowerGems-3.6.1.1.pom << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>dev.iseal</groupId>
          <artifactId>PowerGems</artifactId>
          <version>3.6.1.1</version>
        </project>
        EOF
        cat > ~/.m2/repository/dev/iseal/SealLib/1.2.0.1/SealLib-1.2.0.1.pom << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>dev.iseal</groupId>
          <artifactId>SealLib</artifactId>
          <version>1.2.0.1</version>
        </project>
        EOF

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Get version from pom.xml
      id: get_version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

    - name: Upload to Modrinth
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: XqguI8fH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        files: target/MorePowerGems-*.jar

        name: MorePowerGems v${{ steps.get_version.outputs.VERSION }}
        version: ${{ steps.get_version.outputs.VERSION }}
        version-type: release

        loaders: |
          bukkit
          paper
          spigot
          purpur

        game-versions: |
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10

        dependencies: |
          powergems | depends | *
          seallib | depends | *

        changelog-file: CHANGELOG.md*

        java: 21

    - name: Upload JAR to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/MorePowerGems-*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

