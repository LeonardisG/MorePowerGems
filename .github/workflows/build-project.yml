name: Build project

on:
  push:
    tags:
      - '*.*.*.*'

    branches:
    - Revert-back

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get version from pom.xml
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build it
        run: mvn clean package -B

      - name: Generate Release Notes
        id: gen_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Full message (subject + body) of the commit being released.
          git log -1 --pretty=%B "${{ github.sha }}" > commit_message.md

          gh api --method POST /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ steps.get_version.outputs.VERSION }}" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > generated_notes.md

          # Commit description first, then the auto-generated PR/contributor list.
          # This one file is the body for both the GitHub release and the Modrinth changelog.
          {
            cat commit_message.md
            echo
            echo "---"
            echo
            cat generated_notes.md
          } > release_notes.md

          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: target/MorePowerGems-*.jar
          body_path: release_notes.md

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: XqguI8fH
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: target/MorePowerGems-*.jar
          name: ${{ steps.get_version.outputs.VERSION }}
          version: ${{ steps.get_version.outputs.VERSION }}
          changelog-file: release_notes.md
          loaders: |
            paper
            purpur
          game-versions: '>=1.21 <=26.2'
